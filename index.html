<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Caderneta de Campo FBE</title>
<style>
:root{--navy:#1F3864;--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ok:#2e7d32;--warn:#b26a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2}header small{display:block;font-weight:400;opacity:.8;font-size:11px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.tab{display:none;position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}.tab.on{display:block}
nav{display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400;line-height:1}nav button.on{color:var(--navy);font-weight:600}
#mapwrap{position:absolute;inset:0;background:#e9ecf1;touch-action:none}
#svg{width:100%;height:100%;display:block}
.chips{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;border:1px solid var(--bd);background:#fff;border-radius:16px;padding:6px 10px;font-size:12px;color:var(--tx)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.zoom{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:19px;border:1px solid var(--bd);background:#fff;font-size:20px}
#legend{position:absolute;left:8px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;font-size:11px;max-width:60%}
#legend div{display:flex;align-items:center;gap:6px;margin:2px 0}#legend i{width:14px;height:11px;border:1px solid #0003;display:inline-block;flex:none}
#sum{position:absolute;left:8px;top:46px;font-size:12px;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;border:1px solid var(--bd)}
.pad{stroke-width:.6}.pad.sel{stroke:#000;stroke-width:3}
.lab{font:700 11px Arial,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#111}
.bdg text{font:700 7.5px Arial,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#fff;pointer-events:none}
.pad-wrap{padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eef0f4;font-size:14px}.row:last-child{border:0}.row span:first-child{color:var(--mut)}
h2{font-size:14px;margin:2px 0 6px;color:var(--navy)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--navy);color:#fff}
.btn.sec{background:#e8ecf4;color:var(--navy)}.btn.red{background:#fde8e8;color:#b42318}.btn.sm{padding:8px 11px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:9px;background:#fff;color:var(--tx);font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet,#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}
#sheet.on,#modal.on{display:flex}
.panel{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ph h3{margin:0;font-size:18px}
.x{border:0;background:#e8ecf4;border-radius:16px;width:32px;height:32px;font-size:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.warnb{background:#fff4e0;border:1px solid #f0c36d;color:#7a4b00;border-radius:9px;padding:8px 10px;font-size:13px;margin-top:8px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eef0f4;background:#fff}
.it .sw{width:12px;height:36px;border-radius:4px;flex:none}.it .m{flex:1;min-width:0}.it .m b{font-size:15px}.it .m div{font-size:12px;color:var(--mut)}
.it .r{text-align:right;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left}th{font-size:11px;color:var(--mut);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:50;display:none;max-width:90%}
textarea.big{min-height:130px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
</style></head>

<header><h1>Caderneta de Campo<small id="hdate"></small><small id="hsync" style="display:block;font-size:11px;opacity:.85"></small></h1><button class="chip" id="btnToday" style="display:none"></button></header>
<main>
 <section class="tab on" id="t-mapa"><div id="mapwrap">

   <div class="card list" id="regList" style="padding:0;overflow:hidden"></div></div></section>
 <section class="tab" id="t-aj"><div class="pad-wrap" id="ajust"></div></section>
</main>
<nav id="nav"><button data-t="mapa" class="on"><b>🗺</b>Mapa</button><button data-t="mod"><b>▦</b>Módulos</button><button data-t="ocup"><b>🐂</b>Ocupados</button><button data-t="reg"><b>📝</b>Registros</button><button data-t="aj"><b>⚙</b>Ajustes</button></nav>

   if(!S.prod.some(x=>x.n===prod))S.prod.push({n:prod,u:'g',m:80});return}const p=c[1].trim().toUpperCase(),d=parseDate(c[3]);const t=/^e/i.test((c[2]||'').trim())?'E':/^s/i.test((c[2]||'').trim())?'S':null;
  if(!byId[p]||!d||!t){if(/piquete|data/i.test(line))return;bad++;return}
  const e={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),p,t,d,a:parseNum(c[4]),w:parseNum(c[5]),h:parseNum(c[6]),r:(c[7]||'').trim(),o:(c[8]||'').trim(),src:'import',sent:true};
  const cs=(c[0]||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})/);if(cs)e.stamp=new Date(+cs[3],+cs[2]-1,+cs[1],+cs[4],+cs[5]).toISOString();
  if(have.has(key(e))){skip++;return}have.add(key(e));S.events.push(e);add++});
 save();render();return`${add} movimentação(ões) e ${sadd} suplemento(s) importado(s)`+(skip?`, ${skip} já existiam`:'')+(bad?`, ${bad} linha(s) ignorada(s)`:'')}

/* ---------- ajustes ---------- */
function ajustes(){const p=S.params;
 $('#ajust').innerHTML=`<div class="card"><h2>Quem está lançando</h2><label style="margin-top:0">Responsável (preenche os formulários)</label><input id="aR" value="${esc(S.resp)}" placeholder="seu nome"></div>
 <div class="card"><h2>Parâmetros</h2><div class="g2"><div><label style="margin-top:0">Peso de 1 UA (kg)</label><input id="p0" type="number" value="${p.pesoUA}"></div><div><label style="margin-top:0">Descanso desejado (dias)</label><input id="p1" type="number" value="${p.descMeta}"></div></div>

 <label>Pressão: limites padrão baixa / moderada / alta (UA·dia/ha)</label><div class="g2" style="grid-template-columns:1fr 1fr 1fr"><input id="q0" type="number" step="any" value="${p.pres[0]}"><input id="q1" type="number" step="any" value="${p.pres[1]}"><input id="q2" type="number" step="any" value="${p.pres[2]}"></div>
 <div class="g2"><div><label>Tolerância de peso (kg)</label><input id="t0" type="number" value="${p.tolPeso}"></div><div><label>Dias entre saída e entrada</label><input id="t1" type="number" value="${p.tolDias}"></div><div><label>Mostrar saídas dos últimos (dias)</label><input id="t2" type="number" value="${p.diasMov}"></div><div><label>Tolerância da altura (%)</label><input id="t3" type="number" value="${Math.round(p.tolAlt*100)}"></div></div>
 <div class="btns" style="margin-top:12px"><button class="btn" id="aS">Salvar ajustes</button></div></div>
 <div class="card"><h2>Capins (metas de manejo)</h2><div style="font-size:12px;color:var(--mut);margin-bottom:6px">Valores de exemplo: confira com a assistência técnica. O fator multiplica os limites de pressão do capim.</div>
 <table><tr><th>Capim</th><th>Entr.</th><th>Saída</th><th>Fator</th><th></th></tr>${S.cap.map((c,i)=>`<tr><td><input data-c="${i}" data-f="n" value="${esc(c.n)}"></td><td><input data-c="${i}" data-f="e" type="number" value="${c.e}"></td><td><input data-c="${i}" data-f="s" type="number" value="${c.s}"></td><td><input data-c="${i}" data-f="f" type="number" step="0.05" value="${c.f}"></td><td><button class="x" data-dc="${i}">✕</button></td></tr>`).join('')}</table>
 <div class="btns" style="margin-top:10px"><button class="btn sec" id="cAdd">+ Capim</button></div></div>
 <div class="card"><h2>Suplementos (produtos e metas)</h2><div style="font-size:12px;color:var(--mut);margin-bottom:6px">Exemplos de metas: ajuste com seu nutricionista. Unidade: g = gramas por animal por dia; %PV = percentual do peso vivo por dia.</div>
 <table><tr><th>Produto</th><th>Unid.</th><th>Meta</th><th></th></tr>${S.prod.map((c,i)=>`<tr><td><input data-pr="${i}" data-f="n" value="${esc(c.n)}"></td><td><select data-pr="${i}" data-f="u"><option value="g" ${c.u==='g'?'selected':''}>g</option><option value="pv" ${c.u==='pv'?'selected':''}>%PV</option></select></td><td><input data-pr="${i}" data-f="m" type="number" step="any" value="${c.m}"></td><td><button class="x" data-dp="${i}">✕</button></td></tr>`).join('')}</table>
 <div class="g2" style="margin-top:8px"><div><label>Tolerância da meta (%)</label><input id="ts0" type="number" value="${Math.round((S.params.tolSup||.2)*100)}"></div><div><label>Resumo por módulo: últimos (dias)</label><input id="ts1" type="number" value="${S.params.janSup||30}"></div></div>
 <div class="btns" style="margin-top:10px"><button class="btn sec" id="pAdd">+ Produto</button><button class="btn" id="pSave">Salvar</button></div></div>
 <div class="card"><h2>Sincronização</h2><div style="font-size:13px;color:var(--mut);margin-bottom:8px">Liga este aparelho à planilha compartilhada. Todos os aparelhos passam a ver os mesmos registros (atualiza ao abrir e a cada 3 minutos).</div>
 <label style="margin-top:0">Endereço do servidor</label><input id="syU" value="${esc(S.sync.url)}" placeholder="https://script.google.com/macros/s/…/exec"><label>Código de acesso</label><input id="syC" value="${esc(S.sync.code)}">
 <label>Código do administrador (só o dono, para excluir registros)</label><input id="syA" value="${esc(S.sync.adm)}" placeholder="deixe vazio nos aparelhos dos trabalhadores">
 <div class="btns" style="margin-top:10px"><button class="btn" id="syS">Salvar e sincronizar</button><button class="btn sec" id="syL">Copiar link de configuração</button></div><div id="syM" style="font-size:13px;margin-top:8px;color:var(--mut)">${syncOn()?'Aparelho: '+esc(S.sync.dev)+(S.sync.last?' · última sincronização '+new Date(S.sync.last).toLocaleString('pt-BR'):''):'Não configurado: os dados ficam só neste aparelho.'}</div></div>
 <div class="card"><h2>Dados</h2><div style="font-size:13px;color:var(--mut);margin-bottom:8px">${syncOn()?'Os dados ficam na planilha compartilhada; este aparelho guarda uma cópia.':'Os dados ficam neste aparelho.'} Para ver data diferente de hoje (simulação), use o campo abaixo.</div>
 <label style="margin-top:0">Simular data (vazio = hoje)</label><input type="date" id="sim" value="${SIM||''}"><div class="btns" style="margin-top:10px"><button class="btn red" id="reset">Apagar dados deste aparelho</button></div></div>
 <div style="text-align:center;color:var(--mut);font-size:11px;padding:6px">Caderneta de Campo · Fazenda Boa Esperança</div>`;
 $('#aR').onchange=e=>{S.resp=e.target.value.trim();save()};
 $('#aS').onclick=()=>{const g=i=>+$(i).value;S.params={pesoUA:g('#p0')||450,descMeta:g('#p1')||30,lot:[g('#l0'),g('#l1'),g('#l2')],pres:[g('#q0'),g('#q1'),g('#q2')],tolPeso:g('#t0'),tolDias:g('#t1'),diasMov:g('#t2'),tolAlt:(g('#t3')||10)/100};save();render();toast('Ajustes salvos')};
 document.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{const c=S.cap[+i.dataset.c],f=i.dataset.f;const old=c.n;c[f]=f==='n'?i.value.trim():(+i.value);if(f==='n'){Object.keys(S.capPiq).forEach(k=>{if(S.capPiq[k]===old)S.capPiq[k]=c.n})}save();render()});
 document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{const c=S.cap[+b.dataset.dc];ask('Remover o capim <b>'+esc(c.n)+'</b>?','Remover',()=>{Object.keys(S.capPiq).forEach(k=>{if(S.capPiq[k]===c.n)delete S.capPiq[k]});S.cap.splice(S.cap.indexOf(c),1);save();render();ajustes()})});
 $('#cAdd').onclick=()=>{S.cap.push({n:'Novo capim',e:50,s:25,f:1});save();ajustes()};
 document.querySelectorAll('[data-pr]').forEach(i=>i.onchange=()=>{const c=S.prod[+i.dataset.pr],f=i.dataset.f;const old=c.n;c[f]=f==='m'?+i.value:i.value.trim();if(f==='n'&&c.n!==old)S.sup.forEach(e=>{if(e.prod===old)e.prod=c.n});save();render()});
 document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{const c=S.prod[+b.dataset.dp];ask('Remover o produto <b>'+esc(c.n)+'</b> da lista? Os fornecimentos já registrados continuam salvos.','Remover',()=>{S.prod.splice(S.prod.indexOf(c),1);save();render();ajustes()})});
 $('#pAdd').onclick=()=>{S.prod.push({n:'Novo produto',u:'g',m:100});save();ajustes()};
 $('#pSave').onclick=()=>{S.params.tolSup=(+$('#ts0').value||20)/100;S.params.janSup=+$('#ts1').value||30;save();render();toast('Salvo')};
 $('#sim').onchange=e=>{SIM=e.target.value||null;render()};
 $('#reset').onclick=()=>ask('Apagar <b>todos</b> os registros e ajustes deste aparelho?'+(syncOn()?' Eles serão baixados de novo da planilha.':''),'Apagar tudo',()=>{const sy=S.sync;S=fresh();S.sync=Object.assign({},sy,{last:null,bk:0});S.sup=S.sup||[];save();render();ajustes();toast('Dados apagados');sync()});
 $('#syS').onclick=async()=>{S.sync.url=$('#syU').value.trim();S.sync.code=$('#syC').value.trim();S.sync.adm=$('#syA').value.trim();S.sync.last=null;save();render();$('#syM').textContent='Sincronizando…';const r=await sync();$('#syM').textContent=syMsg(r);if(r&&r.ok)ajustes()};
 $('#syL').onclick=async()=>{if(!syncOn())return toast('Configure o servidor primeiro');const u=location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify({u:S.sync.url,c:S.sync.code}))));
  try{await navigator.clipboard.writeText(u);toast('Link copiado. Envie aos trabalhadores.')}catch(e){$('#syM').innerHTML='Copie o link: <br><span style="word-break:break-all;user-select:all">'+esc(u)+'</span>'}}}
/* ---------- sincronização com a planilha compartilhada ---------- */
const syncOn=()=>!!(S.sync.url&&S.sync.code);
const canDel=e=>!syncOn()||!e.sent||!!S.sync.adm;
let syncing=false,syncErr='',syncT=null;
const pend=()=>S.events.filter(e=>!e.sent).length+S.sup.filter(e=>!e.sent).length;
const slimE=e=>({id:e.id,stamp:e.stamp||null,p:e.p,t:e.t,d:e.d,a:e.a,w:e.w,h:e.h,r:e.r||'',o:e.o||''});
const slimS=e=>({id:e.id,stamp:e.stamp||null,p:e.p,d:e.d,prod:e.prod,kg:e.kg,r:e.r||'',o:e.o||''});
function syncStatus(){const el=$('#hsync');if(!el)return;if(!syncOn()){el.textContent='';return}const p=pend();
 const hm=S.sync.last?new Date(S.sync.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
 el.textContent=syncing?'sincronizando…':syncErr?('sem sincronizar'+(p?' · '+p+' pendente(s)':'')):('sincronizado '+hm+(p?' · '+p+' pendente(s)':''))}
function syncSoon(){if(!syncOn()||!pend())return;clearTimeout(syncT);syncT=setTimeout(()=>sync(),1200)}
function mergeSrv(res,sentEv,sentSup){
 if(!S.sync.bk){try{localStorage.setItem('fbe_pre_sync',JSON.stringify({events:S.events,sup:S.sup}))}catch(e){}S.sync.bk=1}
 const keepE=S.events.filter(e=>!e.sent&&!sentEv.includes(e)),keepS=S.sup.filter(e=>!e.sent&&!sentSup.includes(e));
 S.events=res.ev.map(x=>Object.assign({src:'sync',sent:true},x)).concat(keepE);
 S.sup=res.sup.map(x=>Object.assign({src:'sync',sent:true},x)).concat(keepS);
 res.sup.forEach(x=>{if(!S.prod.some(q=>q.n===x.prod))S.prod.push({n:x.prod,u:'g',m:80})})}
async function sync(opts){opts=opts||{};if(!syncOn()||syncing)return{ok:false,err:'off'};syncing=true;syncStatus();
 const ev=S.events.filter(e=>!e.sent),sup=S.sup.filter(e=>!e.sent);
 const body={code:S.sync.code,dev:S.sync.dev,ev:ev.map(slimE),sup:sup.map(slimS)};if(opts.del)body.del=Object.assign({adm:S.sync.adm},opts.del);
 let res;const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
 try{const r=await fetch(S.sync.url,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,redirect:'follow'});res=await r.json()}
 catch(e){res=null}
 clearTimeout(to);syncing=false;
 if(!res||!res.ok){syncErr=res?res.err||'erro':'rede';syncStatus();return res||{ok:false,err:'rede'}}
 syncErr='';mergeSrv(res,ev,sup);S.sync.last=new Date().toISOString();save();render();return res}
(function(){const m=(location.hash||'').match(/^#cfg=(.+)$/);if(m){try{const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(c.u&&c.c){S.sync.url=c.u;S.sync.code=c.c;S.sync.last=null;S.sync.bk=0;save()}}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}})();
setTimeout(()=>sync(),1500);setInterval(()=>{if(document.visibilityState==='visible')sync()},180000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});addEventListener('online',()=>sync());
function syMsg(r){return !r?'Sem resposta':r.ok?'Sincronizado: '+S.events.length+' movimentação(ões) e '+S.sup.length+' suplemento(s) na planilha.':r.err==='codigo'?'Código de acesso incorreto.':r.err==='rede'?'Sem conexão ou endereço do servidor inválido.':r.err==='ocupado'?'Servidor ocupado, tente de novo.':'Erro: '+(r.msg||r.err)}
